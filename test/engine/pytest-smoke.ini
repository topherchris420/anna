[pytest]
testpaths = test/engine
python_files =
    test_api_*.py
    test_blueprint.py
    test_collections.py
    test_config.py
    test_crawler.py
    test_deck.py
    test_documents.py
    test_embeddings.py
    test_pg.py
    test_registry.py
    test_search.py
    test_shadowlibraries.py
    test_sources.py
    test_summarize.py
    test_web_snippet.py
python_classes = Test*
python_functions = test_*
addopts = -ra --tb=short
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::ResourceWarning
